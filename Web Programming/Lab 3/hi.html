<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form Validation Example</title>

   <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      padding: 10px;
    }

    .box {
      background-color: #f2f2f2;
      border: 2px solid #007bff;
      border-radius: 10px;
      padding: 20px;
      margin: 10px;
      flex: 1 1 300px; /* flexible width */
      text-align: center;
    }

    /* Responsive style for small screens */
    @media screen and (max-width: 600px) {
      header {
        font-size: 18px;
      }
      .box {
        flex: 1 1 100%;
      }
    }
  </style>


</head>
<body>
  <h2>User Registration Form</h2>

  <form action="login.html" method="post">

    <label for="name">Name:</label><br>
    <input type="text" name="name" placeholder="Enter your name" required><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <label for="age">Age:</label><br>
    <input type="number" id="age" name="age" min="18" max="60" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" minlength="6" required><br><br>

   <button type="submit">Submit</button>


   <h2>My College Website</h2>
<iframe src="https://www.pust.ac.bd" width="600" height="400" title="PUST Website"></iframe>

<br>
<form>
  <input type="email" required>
  <input type="number" min="18" max="60">
  <input type="submit">
</form>


<p>This is <ins>added</ins> text.</p>


  </form>
</body>
</html>
