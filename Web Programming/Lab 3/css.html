<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margin, Padding & Border Example</title>
<style>
  /* পুরো পেজে ব্যাকগ্রাউন্ড রঙ */
  body {
    background-color: #f2f2f2;
    font-family: Arial;
  }

  /* সাধারণ বক্স */
  .box {
    background-color: lightblue;  /* বক্সের রঙ */
    border: 1px solid blue;       /* বর্ডার: মোটা নীল রেখা */
    padding: 10px;                /* কনটেন্ট আর বর্ডারের মাঝের জায়গা */
    margin: 10px;                 /* বক্সের বাইরের জায়গা (অন্য জিনিস থেকে দূরত্ব) */
  }
</style>
</head>
<body>

<h2>Margin, Padding এবং Border উদাহরণ</h2>

<div class="box">
  এটি একটি বক্স 🟦 <br><br>
  🔹 <b>Padding</b> → এই লেখার চারপাশে ফাঁকা জায়গা তৈরি করে (বর্ডারের ভিতরে)। <br>
  🔹 <b>Border</b> → বক্সের চারপাশে নীল রেখা। <br>
  🔹 <b>Margin</b> → বক্সের বাইরে ফাঁকা জায়গা (অন্য এলিমেন্ট থেকে দূরে রাখে)।
</div>

<p>⬆️ উপরের বক্সের চারপাশে ধূসর রঙের জায়গাটা হলো margin।</p>

</body>
</html>
